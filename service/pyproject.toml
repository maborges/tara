[project]
name = "agrosaas-balanca-service"
version = "1.0.0"
description = "Serviço independente de pesagem, estação e conciliação do AgroSaaS"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "pydantic-settings>=2.0,<3",
  "httpx>=0.27,<1",
  "bcrypt>=4.0,<5",
  "python-jose[cryptography]>=3.3,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
